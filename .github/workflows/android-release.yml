name: Q-BOIX Android Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17 and Gradle 8.7
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.QBOIX_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.QBOIX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.QBOIX_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.QBOIX_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Configure QBOIX_KEYSTORE_BASE64, QBOIX_KEY_ALIAS, QBOIX_KEY_PASSWORD and QBOIX_STORE_PASSWORD in GitHub Actions Secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/qboix-release.jks"
          echo "QBOIX_KEYSTORE_PATH=$RUNNER_TEMP/qboix-release.jks" >> "$GITHUB_ENV"
          echo "QBOIX_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "QBOIX_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "QBOIX_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed APK
        id: build
        run: |
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          VERSION_NAME="0.$VERSION_CODE"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          gradle --no-daemon assembleRelease -PqboixVersionCode="$VERSION_CODE" -PqboixVersionName="$VERSION_NAME"
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/QBOIX.apk
          SHA256=$(sha256sum release-output/QBOIX.apk | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Create update metadata
        env:
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          APK_URL="https://github.com/$REPOSITORY/releases/download/v$VERSION_CODE/QBOIX.apk"
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "apkUrl": "%s",\n  "sha256": "%s",\n  "releaseNotes": "Q-BOIX update from GitHub main."\n}\n' "$VERSION_CODE" "$VERSION_NAME" "$APK_URL" "$SHA256" > release-output/update.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.build.outputs.version_code }}
          name: Q-BOIX v${{ steps.build.outputs.version_name }}
          body: |
            Automated Q-BOIX Android release from main.
            APK SHA-256: ${{ steps.build.outputs.sha256 }}
          files: |
            release-output/QBOIX.apk
            release-output/update.json
          fail_on_unmatched_files: true
