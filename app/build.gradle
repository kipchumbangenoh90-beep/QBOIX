plugins {
    id 'com.android.application'
}

def qboixKeystorePath = System.getenv('QBOIX_KEYSTORE_PATH')
def qboixStorePassword = System.getenv('QBOIX_STORE_PASSWORD')
def qboixKeyAlias = System.getenv('QBOIX_KEY_ALIAS')
def qboixKeyPassword = System.getenv('QBOIX_KEY_PASSWORD')
def qboixHasReleaseSigning = [qboixKeystorePath, qboixStorePassword, qboixKeyAlias, qboixKeyPassword]
        .every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.qboix.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.qboix.app'
        minSdk 26
        targetSdk 34
        versionCode (project.findProperty('qboixVersionCode') ?: '1').toString().toInteger()
        versionName (project.findProperty('qboixVersionName') ?: '0.1').toString()
    }

    signingConfigs {
        if (qboixHasReleaseSigning) {
            release {
                storeFile file(qboixKeystorePath)
                storePassword qboixStorePassword
                keyAlias qboixKeyAlias
                keyPassword qboixKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (qboixHasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
