plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qboix.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.qboix.app'
        minSdk 26
        targetSdk 34
        versionCode (project.findProperty('qboixVersionCode') ?: '1').toInteger()
        versionName (project.findProperty('qboixVersionName') ?: '0.1').toString()
    }

    signingConfigs {
        release {
            def keyPath = System.getenv('QBOIX_KEYSTORE_PATH')
            if (keyPath != null && !keyPath.trim().isEmpty()) {
                storeFile file(keyPath)
                storePassword System.getenv('QBOIX_STORE_PASSWORD')
                keyAlias System.getenv('QBOIX_KEY_ALIAS')
                keyPassword System.getenv('QBOIX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
